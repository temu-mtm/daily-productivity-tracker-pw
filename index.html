<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="A simple daily productivity tracker.">
  <title>Daily Focus</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow" id="todayLabel">YOUR DAY</p>
        <h1>Daily Focus</h1>
      </div>
      <div class="avatar" aria-label="Your workspace">DF</div>
    </header>

    <section class="progress-card" aria-label="Daily progress">
      <div class="progress-copy">
        <p class="eyebrow light">DAILY PROGRESS</p>
        <h2><span id="progressPercent">0</span>% completed</h2>
        <p id="progressMessage">A fresh start. Choose one task to begin.</p>
      </div>
      <div class="progress-ring" id="progressRing" role="img" aria-label="0 percent complete">
        <span id="ringPercent">0%</span>
      </div>
    </section>

    <section class="stats" aria-label="Task summary">
      <article class="stat-card">
        <span class="stat-icon blue">☰</span>
        <span class="stat-number" id="totalCount">0</span>
        <span class="stat-label">Total tasks</span>
      </article>
      <article class="stat-card">
        <span class="stat-icon green">✓</span>
        <span class="stat-number" id="doneCount">0</span>
        <span class="stat-label">Completed</span>
      </article>
      <article class="stat-card">
        <span class="stat-icon orange">◷</span>
        <span class="stat-number" id="leftCount">0</span>
        <span class="stat-label">Remaining</span>
      </article>
    </section>

    <section class="tasks-section">
      <div class="section-heading">
        <div>
          <p class="eyebrow">MAKE IT HAPPEN</p>
          <h2>Today's tasks</h2>
        </div>
        <span class="task-date" id="dateShort"></span>
      </div>

      <form id="taskForm" class="add-form">
        <label class="sr-only" for="taskInput">New task</label>
        <input id="taskInput" type="text" maxlength="90" placeholder="What do you need to do?" autocomplete="off" required>
        <button type="submit" aria-label="Add task">+</button>
      </form>

      <div class="filter-row" role="group" aria-label="Filter tasks">
        <button class="filter-btn active" data-filter="all" type="button">All</button>
        <button class="filter-btn" data-filter="active" type="button">To do</button>
        <button class="filter-btn" data-filter="done" type="button">Completed</button>
      </div>

      <ul id="taskList" class="task-list" aria-live="polite"></ul>
      <p id="emptyState" class="empty-state">No tasks here yet. Add your first task above.</p>
    </section>

    <footer class="footer-note">
      <span class="offline-dot"></span>
      <span id="connectionText">Your tasks are saved on this device</span>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
